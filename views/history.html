<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | SleepWell</title>

    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>

    <header>
        <h2>🌙 SleepWell</h2>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/sleep">Sleep Tracking</a>
            <a href="/health">Health Tracking</a>
            <a href="/history">History</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="container">

        <h1>Your Activity History</h1>
        <p>Review your previously saved sleep and health records.</p>

        <section class="card">
            <h2>Sleep History</h2>
            <div id="sleepHistory">
                Loading sleep records...
            </div>
        </section>

        <section class="card">
            <h2>Health History</h2>
            <div id="healthHistory">
                Loading health records...
            </div>
        </section>

    </main>

    <script src="/JS/history.js"></script>

</body>
</html>
